<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSA Extension - Regional Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            color: #58a6ff;
            font-size: 3em;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.2em;
            color: #8b949e;
            margin-bottom: 50px;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 300px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .card-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 0 0 10px 0;
            color: #c9d1d9;
        }

        .card p {
            color: #8b949e;
            font-size: 0.9em;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trading Analysis Portal</h1>
        <p class="subtitle">Select your market region to begin</p>
        
        <div class="cards">
            <a href="/app.html?region=india" class="card">
                <div class="card-icon">🇮🇳</div>
                <h2>India Stocks</h2>
                <p>Track NSE/BSE stocks with advanced pattern recognition.</p>
                <p style="margin-top: 15px; font-weight: 500; color: #58a6ff;">Enter Market &rarr;</p>
            </a>
            
            <a href="/app.html?region=us" class="card">
                <div class="card-icon">🇺🇸</div>
                <h2>US Stocks</h2>
                <p>Track NYSE/NASDAQ stocks with advanced pattern recognition.</p>
                <p style="margin-top: 15px; font-weight: 500; color: #58a6ff;">Enter Market &rarr;</p>
            </a>
        </div>
    </div>
</body>
</html>
